<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#030303"><title>JustPetrov — Admin Dashboard</title><link rel="icon" type="image/png" href="../assets/favicon.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../footer.css"><style>body{min-height:100vh}.admin{max-width:1000px;margin:0 auto;padding:120px 24px 100px}.admin h1{font-size:clamp(42px,8vw,80px);line-height:.9;margin:0 0 28px}.admin h1 span{color:var(--gold-bright)}.box{border:1px solid var(--line);padding:26px;background:rgba(255,255,255,.015)}label{display:block;font:700 10px 'Space Mono',monospace;letter-spacing:.12em;color:var(--gold-bright);margin-bottom:8px}input{width:100%;box-sizing:border-box;background:#050505;border:1px solid var(--line);color:inherit;padding:14px;font:14px 'Space Mono',monospace;margin-bottom:14px}button{border:1px solid var(--gold-bright);background:transparent;color:inherit;padding:13px 18px;font:700 11px 'Space Mono',monospace;cursor:pointer;margin:4px 4px 4px 0}button:hover{background:var(--gold-bright);color:#000}.error{display:none;color:#d66;margin-top:14px;font:11px 'Space Mono',monospace}.setup{display:none}.note{font:12px/1.7 Inter,sans-serif;color:var(--muted)}.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{position:relative;border:0;border-bottom:2px solid transparent;margin:0;padding:13px 18px;color:var(--muted)}.tab.active{color:var(--gold-bright);border-bottom-color:var(--gold)}.panel{display:none}.panel.active{display:block}.quota-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.quota-head h2{margin:0;font:700 13px 'Space Mono',monospace;letter-spacing:.08em;color:var(--gold-bright)}.quota-refresh{padding:8px 11px;margin:0;font-size:9px}.quota-list{display:grid;gap:8px}.quota-empty{padding:16px;border:1px dashed var(--line);color:var(--muted);font:11px/1.6 'Space Mono',monospace}.quota-item{border:1px solid var(--line);background:#050505;padding:12px}.quota-item-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}.quota-item strong{font:700 10px 'Space Mono',monospace;color:#d66;letter-spacing:.06em}.quota-time{font:10px 'Space Mono',monospace;color:var(--muted);text-align:right}.quota-meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:#bbb;font:10px/1.5 'Space Mono',monospace}.quota-meta span{overflow-wrap:anywhere}.quota-count{margin-top:12px;color:var(--muted);font:10px 'Space Mono',monospace}.admin-footer-link{position:fixed;right:24px;bottom:24px;font:700 9px 'Space Mono',monospace;letter-spacing:.1em;color:var(--muted);text-decoration:none}.admin-footer-link:hover{color:var(--gold-bright)}.back-home{display:inline-flex;align-items:center;gap:8px;margin-bottom:30px;padding:11px 16px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font:700 10px 'Space Mono',monospace;letter-spacing:.08em;transition:color .2s ease,background .2s ease,border-color .2s ease}.back-home:hover{color:#000;background:var(--gold-bright);border-color:var(--gold-bright)}@media(max-width:600px){.admin{padding:100px 18px 90px}.box{padding:20px}.quota-item-top{align-items:flex-start;flex-direction:column;gap:4px}.admin-footer-link{right:18px;bottom:18px}.back-home{margin-bottom:24px}}</style></head><body><div class="grain"></div><main class="admin"><a class="back-home" href="/" aria-label="Back to home">← BACK TO HOME</a><div class="kicker">JUSTPETROV / PRIVATE</div><h1>ADMIN<br><span>DASHBOARD</span></h1><div class="box" id="login"><label for="user">USERNAME</label><input id="user" autocomplete="username"><label for="pass">PASSWORD</label><input id="pass" type="password" autocomplete="current-password"><button id="loginBtn">LOGIN</button><div class="error" id="error"></div></div><div class="box" id="twofa" style="display:none"><p class="note">A 6-digit authentication code was sent to the admin mailbox.</p><label for="code">AUTH CODE</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="verifyBtn">VERIFY CODE</button><button id="backBtn">BACK</button><div class="error" id="twofaError"></div></div><div class="setup" id="setup"><div class="tabs"><button class="tab active" data-tab="spotify">SPOTIFY</button></div><section class="panel active" id="spotify"><div class="box"><div class="quota-head"><h2>SPOTIFY / QUOTA LOG</h2><button class="quota-refresh" id="quotaRefresh" type="button">REFRESH</button></div><p class="note">Spotify API quota errors detected by the collector. The newest events are shown first, including retry timing and the affected endpoint.</p><div class="quota-list" id="quotaList"></div><div class="quota-count" id="quotaCount"></div></div><div class="box" style="margin-top:14px"><button id="logout">LOGOUT</button></div></section></div></main><a class="admin-footer-link" href="mailto:ben@justpetrov.com">CONTACT ME</a><script>const $=id=>document.getElementById(id),api='auth.php';function show(id){$('login').style.display=id==='login'?'block':'none';$('twofa').style.display=id==='twofa'?'block':'none';$('setup').style.display=id==='setup'?'block':'none';if(id==='setup')loadQuotaLog()}function error(id,msg){$(id).textContent=msg;$(id).style.display='block'}async function call(action,data={}){const r=await fetch(api+'?action='+encodeURIComponent(action),{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},cache:'no-store',body:JSON.stringify(data)});const d=await r.json().catch(()=>({ok:false,message:'Server error'}));if(!r.ok||!d.ok)throw Error(d.message||'Request failed');return d}function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function formatQuotaTime(value){const d=new Date(value);return Number.isNaN(d.getTime())?String(value||'Unknown'):d.toLocaleString('nl-NL',{dateStyle:'short',timeStyle:'medium'})}async function loadQuotaLog(){const list=$('quotaList'),count=$('quotaCount');list.innerHTML='<div class="quota-empty">Loading quota log…</div>';try{const d=await call('quota_log');if(!d.logs?.length){list.innerHTML='<div class="quota-empty">No QUOTA_EXCEEDED events have been logged.</div>';count.textContent='0 events';return}list.innerHTML=d.logs.map((item,index)=>`<article class="quota-item"><div class="quota-item-top"><strong>QUOTA_EXCEEDED #${d.logs.length-index}</strong><span class="quota-time">${escapeHtml(formatQuotaTime(item.timestamp))}</span></div><div class="quota-meta"><span>Endpoint: ${escapeHtml(item.endpoint||'Unknown')}</span><span>Status: ${escapeHtml(item.status??429)}</span><span>Retry: ${item.retryAfter==null?'n/a':escapeHtml(item.retryAfter+'s')}</span>${item.message?`<span>${escapeHtml(item.message)}</span>`:''}</div></article>`).join('');count.textContent=`${d.count} event${d.count===1?'':'s'} shown`;}catch(e){list.innerHTML=`<div class="quota-empty">${escapeHtml(e.message||'Could not load quota log.')}</div>`;count.textContent=''}}$('loginBtn').onclick=async()=>{$('error').style.display='none';try{await call('request',{username:$('user').value,password:$('pass').value});$('pass').value='';show('twofa');$('code').focus()}catch(e){error('error',e.message)}};$('pass').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('verifyBtn').onclick=async()=>{$('twofaError').style.display='none';try{await call('verify',{code:$('code').value});show('setup')}catch(e){error('twofaError',e.message)}};$('code').onkeydown=e=>{if(e.key==='Enter')$('verifyBtn').click()};$('backBtn').onclick=()=>{show('login');$('code').value=''};$('quotaRefresh').onclick=loadQuotaLog;$('logout').onclick=async()=>{try{await call('logout')}finally{show('login')}};async function status(){try{const d=await call('status');if(d.authenticated)show('setup')}catch(e){show('login')}}status();</script></body></html>
