name: One-time Music Stats nav fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nav styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('footer.js')
          s = p.read_text()
          old = ".nav nav>a:before{content:none!important;display:none!important}\n.nav nav>a.active:after{"
          new = ".nav nav>a,.nav nav>a.active{background:transparent!important;box-shadow:none!important;border:0!important}\n.nav nav>a:before{content:none!important;display:none!important}\n.nav nav>a.active:after{"
          if old not in s:
              raise SystemExit('Expected nav CSS marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add footer.js .github/workflows/one-time-music-stats-nav-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix Music Stats nav white block [skip ci]"
          git push
          git rm .github/workflows/one-time-music-stats-nav-fix.yml
          git commit -m "Remove one-time Music Stats nav fix [skip ci]"
          git push
