name: One-time marquee animation fix
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force marquee animation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacement = '@media(prefers-reduced-motion:reduce){.worked-track{animation:workedMarquee 22s linear infinite!important;animation-play-state:running!important}.worked-slide{animation:none;opacity:1}}'
          for name in ['footer.css', 'footer.js']:
              p = Path(name)
              s = p.read_text()
              s, count = re.subn(r'@media\(prefers-reduced-motion:reduce\)\{\.worked-track\{[^}]*\}(?:\.worked-slide\{[^}]*\})?\}', replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f'Expected reduced-motion marquee rule not found in {name}')
              p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = s.replace('/footer.css?v=20260910.3', '/footer.css?v=20260910.4', 1)
          s = s.replace('/footer.js?v=20260910.3', '/footer.js?v=20260910.4', 1)
          p.write_text(s)
          PY
      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add footer.css footer.js index.html
          git commit -m 'Fix footer marquee animation [skip ci]'
          git rm .github/workflows/one-time-marquee-fix.yml
          git commit -m 'Remove one-time marquee workflow [skip ci]'
          git push