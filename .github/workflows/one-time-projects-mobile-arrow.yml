name: One-time Projects mobile arrow fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('footer.js')
          s = p.read_text()
          old = '''  const trigger=projectsLink.cloneNode(true);trigger.removeAttribute('class');trigger.setAttribute('aria-haspopup','true');trigger.setAttribute('aria-expanded','false');trigger.innerHTML='PROJECTS <span class="dropdown-chevron">▾</span>';\n  const submenu=document.createElement('div');submenu.className='projects-dropdown-menu';\n  const modrinth=document.createElement('a');modrinth.href='/modrinth';modrinth.textContent='MODRINTH';if(current==='/modrinth')modrinth.className='active';submenu.appendChild(modrinth);\n  dropdown.append(trigger,submenu);projectsLink.replaceWith(dropdown);\n  trigger.addEventListener('click',e=>{if(window.innerWidth<=900){e.preventDefault();const open=dropdown.classList.toggle('open');trigger.setAttribute('aria-expanded',String(open))}});'''
          new = '''  const trigger=projectsLink;trigger.removeAttribute('class');trigger.setAttribute('aria-haspopup','true');trigger.setAttribute('aria-expanded','false');\n  const arrow=document.createElement('button');arrow.type='button';arrow.className='projects-mobile-arrow';arrow.setAttribute('aria-label','Open Projects submenu');arrow.setAttribute('aria-expanded','false');arrow.innerHTML='▾';\n  const submenu=document.createElement('div');submenu.className='projects-dropdown-menu';\n  const modrinth=document.createElement('a');modrinth.href='/modrinth';modrinth.textContent='MODRINTH';if(current==='/modrinth')modrinth.className='active';submenu.appendChild(modrinth);\n  dropdown.append(trigger,arrow,submenu);projectsLink.replaceWith(dropdown);\n  arrow.addEventListener('click',e=>{if(window.innerWidth<=900){e.preventDefault();e.stopPropagation();const open=dropdown.classList.toggle('open');arrow.setAttribute('aria-expanded',String(open));arrow.setAttribute('aria-label',open?'Close Projects submenu':'Open Projects submenu')}});'''
          if old not in s:
            raise SystemExit('Expected navigation block not found')
          s = s.replace(old, new, 1)
          old_css = '.dropdown-chevron{font-size:9px;margin-left:5px}\n.nav nav .projects-dropdown>a{height:100%;display:flex;align-items:center;text-decoration:none}'
          new_css = '''.dropdown-chevron{font-size:9px;margin-left:5px}\n.projects-mobile-arrow{display:none!important}\n.nav nav .projects-dropdown>a{height:100%;display:flex;align-items:center;text-decoration:none}\n@media(max-width:900px){.nav nav.mobile-menu .projects-dropdown{position:relative}.nav nav.mobile-menu .projects-dropdown>a{width:calc(100% - 44px)!important}.nav nav.mobile-menu .projects-mobile-arrow{display:flex!important;position:absolute!important;right:0!important;top:0!important;width:42px!important;height:52px!important;align-items:center!important;justify-content:center!important;border:0!important;background:transparent!important;color:var(--gold-bright)!important;font:700 16px 'Space Mono',monospace!important;cursor:pointer!important;padding:0!important}.nav nav.mobile-menu .projects-dropdown.open .projects-mobile-arrow{transform:rotate(180deg)} }'''
          if old_css not in s:
            raise SystemExit('Expected CSS block not found')
          s = s.replace(old_css, new_css, 1)
          p.write_text(s)
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add footer.js .github/workflows/one-time-projects-mobile-arrow.yml
          git commit -m "fix: make projects link clickable with mobile submenu arrow" || exit 0
          git rm .github/workflows/one-time-projects-mobile-arrow.yml
          git commit -m "chore: remove one-time navigation workflow"
          git push