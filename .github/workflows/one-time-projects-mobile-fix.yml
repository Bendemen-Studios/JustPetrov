name: One-time Projects mobile fix
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Projects navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('footer.js')
          s=p.read_text()
          old="trigger.addEventListener('click',e=>{if(window.innerWidth<=900){e.preventDefault();const open=dropdown.classList.toggle('open');trigger.setAttribute('aria-expanded',String(open))}});"
          new="trigger.addEventListener('click',e=>{if(window.innerWidth<=900){return}});"
          if old not in s:
              raise SystemExit('Expected Projects mobile click handler not found')
          p.write_text(s.replace(old,new,1))
          
          p=Path('modrinth/index.html')
          s=p.read_text()
          old="<a class=\"modrinth-card\" href=\"https://modrinth.com/project/theendcollection\""
          new="<a class=\"modrinth-card\" href=\"https://modrinth.com/mod/theendcollection\""
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add footer.js modrinth/index.html .github/workflows/one-time-projects-mobile-fix.yml
          git commit -m "fix: make Projects clickable and Modrinth-only active" || exit 0
          git rm .github/workflows/one-time-projects-mobile-fix.yml
          git commit -m "chore: remove one-time projects fix workflow [skip ci]"
          git push
