name: Fix Stichting Superhelden asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-asset:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create correctly named asset
        run: cp assets/workedwith/stichtingssuperhelden.png assets/workedwith/stichtingsuperhelden.png
      - name: Commit asset and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/workedwith/stichtingsuperhelden.png
          git rm .github/workflows/fix-stichting-logo.yml
          git commit -m 'Fix Stichting Superhelden asset path'
          git push
