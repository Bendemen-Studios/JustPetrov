name: One-time Projects Arrow Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch footer.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('footer.js')
          s=p.read_text()
          old=""".dropdown-chevron{font-size:9px;margin-left:5px}\n.nav nav .projects-dropdown>a{height:100%;display:flex;align-items:center;text-decoration:none}"""
          new=""".dropdown-chevron{font-size:9px;margin-left:5px}\n.projects-mobile-arrow{display:none}\n.nav nav .projects-dropdown>a{height:100%;display:flex;align-items:center;text-decoration:none}\n@media(max-width:900px){.projects-dropdown>a{padding-right:48px!important}.projects-mobile-arrow{display:flex!important;position:absolute!important;right:0!important;top:0!important;width:42px!important;height:52px!important;align-items:center!important;justify-content:center!important;padding:0!important;border:0!important;border-bottom:1px solid var(--line-soft)!important;background:transparent!important;color:var(--gold-bright)!important;font:700 15px/1 'Space Mono',monospace!important;cursor:pointer!important;z-index:2}.projects-mobile-arrow:after{content:'⌄';transition:transform .2s ease}.projects-dropdown.open .projects-mobile-arrow:after{transform:rotate(180deg)}}"""
          if old not in s: raise SystemExit('CSS anchor not found')
          s=s.replace(old,new,1)
          old2="""  dropdown.append(trigger,submenu);projectsLink.replaceWith(dropdown);\n  trigger.addEventListener('click',e=>{if(window.innerWidth<=900){return}});"""
          new2="""  const arrow=document.createElement('button');arrow.type='button';arrow.className='projects-mobile-arrow';arrow.setAttribute('aria-label','Toggle Projects submenu');arrow.setAttribute('aria-expanded','false');dropdown.append(trigger,submenu,arrow);projectsLink.replaceWith(dropdown);\n  const setOpen=open=>{dropdown.classList.toggle('open',open);arrow.setAttribute('aria-expanded',String(open));trigger.setAttribute('aria-expanded',String(open))};\n  arrow.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setOpen(!dropdown.classList.contains('open'))});\n  trigger.addEventListener('click',e=>{if(window.innerWidth<=900){e.preventDefault();location.href='/projects'}});"""
          if old2 not in s: raise SystemExit('JS anchor not found')
          s=s.replace(old2,new2,1)
          old3="""const close=()=>{mobile.classList.remove('open');backdrop.classList.remove('open');nav.classList.remove('mobile-open');document.body.classList.remove('menu-open');button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','Open menu');const pd=mobile.querySelector('.projects-dropdown');if(pd){pd.classList.remove('open');const t=pd.querySelector(':scope>a');if(t)t.setAttribute('aria-expanded','false')}};"""
          new3="""const close=()=>{mobile.classList.remove('open');backdrop.classList.remove('open');nav.classList.remove('mobile-open');document.body.classList.remove('menu-open');button.setAttribute('aria-expanded','false');button.setAttribute('aria-label','Open menu');const pd=mobile.querySelector('.projects-dropdown');if(pd){pd.classList.remove('open');const t=pd.querySelector(':scope>a');if(t)t.setAttribute('aria-expanded','false');const ar=pd.querySelector('.projects-mobile-arrow');if(ar)ar.setAttribute('aria-expanded','false')}};"""
          if old3 not in s: raise SystemExit('close anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add footer.js
          git commit -m 'fix: add mobile submenu arrow [skip ci]'
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/one-time-projects-arrow-fix.yml
          git commit -m 'chore: remove one-time projects arrow workflow [skip ci]'
          git push