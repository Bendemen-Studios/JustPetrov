name: One-time hide desktop mobile toggle
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide toggle on desktop
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('footer.js')
          s = p.read_text()
          old = ".worked-slide{contain:layout paint}\n.nav nav>a,.nav nav>a.active"
          new = ".worked-slide{contain:layout paint}\n.mobile-menu-toggle{display:none!important}\n.nav nav>a,.nav nav>a.active"
          if old not in s:
              raise SystemExit('target CSS not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add footer.js .github/workflows/one-time-hide-desktop-menu-toggle.yml
          git commit -m "fix: hide mobile menu toggle on desktop [skip ci]"
          git rm .github/workflows/one-time-hide-desktop-menu-toggle.yml
          git commit -m "chore: remove one-time menu toggle workflow [skip ci]"
          git push