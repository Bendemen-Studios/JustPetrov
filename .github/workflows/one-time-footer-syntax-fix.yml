name: One-time footer syntax fix
on:
  push:
    paths:
      - '.github/workflows/one-time-footer-syntax-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix literal newline escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('footer.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\\\\n', '\n')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check footer.js
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add footer.js
          git commit -m 'Fix footer JavaScript syntax' || true
          rm -f .github/workflows/one-time-footer-syntax-fix.yml
          git add -A
          git commit -m 'Remove one-time footer syntax workflow' || true
          git push
