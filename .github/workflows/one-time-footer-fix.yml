name: One-time footer fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-footer-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix global footer logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('footer.js')
          s = p.read_text()
          s = s.replace("const key=(img.getAttribute('src')||'').split('/').pop().toLowerCase();", "const key=((img.getAttribute('src')||'').split('/').pop().split('?')[0].split('#')[0]).toLowerCase();")
          s = s.replace("track.querySelectorAll('.worked-slide[aria-hidden=\"true\"] a').forEach(a=>{a.removeAttribute('href');a.removeAttribute('target');a.removeAttribute('rel');a.setAttribute('tabindex','-1')});\n", "")
          s = s.replace('.worked-track{gap:18px;animation-duration:15s}', '.worked-track{gap:18px;animation-duration:22s}')
          p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add footer.js
          git rm .github/workflows/one-time-footer-fix.yml
          git commit -m "Fix global footer logo links [skip ci]"
          git push
