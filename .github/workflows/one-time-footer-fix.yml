name: One-time footer fix
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.event.head_commit.message != 'chore: restore footer marquee and admin dashboard'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix footer
        shell: python
        run: |
          from pathlib import Path
          p=Path('footer.js')
          s=p.read_text()
          s=s.replace("trigger.innerHTML='PROJECTS <span class=\"dropdown-chevron\">▾</span>'", "trigger.innerHTML='PROJECTS'")
          old="document.querySelectorAll('.footer-meta').forEach(el=>{const text=el.textContent.trim();el.textContent=text.replace(/\\b20\\d{2}\\b\\s*$/,'')+' '+new Date().getFullYear()});"
          new=old+"\n\n// Add the admin dashboard link to every shared footer contact row.\ndocument.querySelectorAll('footer .contact').forEach(contact=>{if(!contact.querySelector('.admin-dashboard-link')){const a=document.createElement('a');a.className='admin-dashboard-link';a.href='/stats/petrovskisystem/';a.textContent='Admin Dashboard';contact.appendChild(a)}});"
          if 'admin-dashboard-link' not in s:
            s=s.replace(old,new)
          p.write_text(s)
          p=Path('footer.css')
          s=p.read_text()
          marker="@media(prefers-reduced-motion:reduce){.worked-track{animation:none;transform:none}"
          if marker in s and "@media(min-width:901px){footer .contact .admin-dashboard-link" not in s:
            s=s.replace(marker, "@media(min-width:901px){footer .contact .admin-dashboard-link{margin-left:auto;color:var(--gold-bright)!important}}@media(max-width:900px){footer .contact .admin-dashboard-link{margin-left:auto;color:var(--gold-bright)!important}}"+marker)
          # Repair the malformed reduced-motion block from the previous edit.
          bad="@media(prefers-reduced-motion:reduce){.worked-track{animation:none;transform:none}.worked-slide{animation:none;opacity:1}@media(min-width:901px)"
          if bad in s:
            s=s.replace(bad,"@media(prefers-reduced-motion:reduce){.worked-track{animation:none;transform:none}.worked-slide{animation:none;opacity:1}}@media(min-width:901px)")
          p.write_text(s)
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-time-footer-fix.yml
          git add footer.js footer.css .github/workflows/one-time-footer-fix.yml
          git commit -m 'chore: restore footer marquee and admin dashboard'
          git push
