name: One-time global cookie style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-cookie-global.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make cookie styling global
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('footer.js')
          s = p.read_text()
          needle = 'document.head.appendChild(style);'
          insert = "document.head.appendChild(style);\nconst cookieStyle=document.createElement('link');cookieStyle.rel='stylesheet';cookieStyle.href='/cookie.css?v=20260910';document.head.appendChild(cookieStyle);"
          if "cookieStyle.href='/cookie.css?v=20260910'" not in s:
              s = s.replace(needle, insert, 1)
          p.write_text(s)
          p = Path('index.html')
          s = p.read_text().replace('<link rel="stylesheet" href="/cookie.css?v=20260910">','')
          p.write_text(s)
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add footer.js index.html
          git rm .github/workflows/one-time-cookie-global.yml
          git commit -m "Make cookie styling global [skip ci]"
          git push
