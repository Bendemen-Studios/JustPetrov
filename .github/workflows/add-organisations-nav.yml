name: Add Organisations to navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Organisations navigation item
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'href="/organisations"' in text:
                  continue
              marker = '<a href="/skills">SKILLS</a>'
              replacement = marker + '<a href="/organisations">ORGANISATIONS</a>'
              if marker in text:
                  path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
                  changed.append(str(path))
          print('Patched:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit navigation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No navigation changes needed.'
            git rm .github/workflows/add-organisations-nav.yml
            git commit -m 'Remove navigation patch workflow'
          else
            git rm .github/workflows/add-organisations-nav.yml
            git commit -m 'Add Organisations to desktop and mobile navigation'
          fi
          git push
