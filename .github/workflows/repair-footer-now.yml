name: Repair footer now
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair footer files
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('footer.js')
          s = p.read_text()
          s = s.replace("trigger.innerHTML='PROJECTS <span class=\"dropdown-chevron\">▾</span>'", "trigger.innerHTML='PROJECTS'")
          if 'admin-dashboard-link' not in s:
              needle = "document.querySelectorAll('.footer-meta').forEach(el=>{const text=el.textContent.trim();el.textContent=text.replace(/\\b20\\d{2}\\b\\s*$/,'')+' '+new Date().getFullYear()});"
              addition = needle + "\n\ndocument.querySelectorAll('footer .contact').forEach(contact=>{if(!contact.querySelector('.admin-dashboard-link')){const a=document.createElement('a');a.className='admin-dashboard-link';a.href='/stats/petrovskisystem/';a.textContent='Admin Dashboard';contact.appendChild(a)}});"
              if needle in s:
                  s = s.replace(needle, addition)
          p.write_text(s)

          p = Path('footer.css')
          s = p.read_text()
          bad = "@media(prefers-reduced-motion:reduce){.worked-track{animation:none;transform:none}.worked-slide{animation:none;opacity:1}@media(min-width:901px){footer .contact .admin-dashboard-link{margin-left:auto;color:var(--gold-bright)!important}}@media(max-width:900px){footer .contact .admin-dashboard-link{margin-left:auto;color:var(--gold-bright)!important}}"
          if bad in s:
              s = s.replace(bad, "@media(prefers-reduced-motion:reduce){.worked-track{animation:none;transform:none}.worked-slide{animation:none;opacity:1}}@media(min-width:901px){footer .contact .admin-dashboard-link{margin-left:auto;color:var(--gold-bright)!important}}@media(max-width:900px){footer .contact .admin-dashboard-link{margin-left:auto;color:var(--gold-bright)!important}}")
          p.write_text(s)
          PY
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-footer-now.yml .github/workflows/one-time-footer-fix.yml
          git add footer.js footer.css .github/workflows/repair-footer-now.yml .github/workflows/one-time-footer-fix.yml
          git commit -m 'chore: repair footer marquee and admin dashboard'
          git push
